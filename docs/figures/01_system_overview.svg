<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1340" viewBox="0 0 1900 1340"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#617A96"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172B45}.title{font-weight:700;font-size:34px}.sub{font-size:20px;fill:#566D86}.head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px;fill:#566D86}</style><text x="65" y="65" class="title">SƠ ĐỒ TỔNG QUÁT HỆ THỐNG</text><text x="65" y="103" class="sub">Phân tích và trực quan hóa dữ liệu tin tuyển dụng công nghệ thông tin tại Việt Nam</text><text x="65" y="164" class="head" style="fill:#007F83">01  THU THẬP VÀ XỬ LÝ DỮ LIỆU</text><rect x="65" y="192" width="540" height="160" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="65" y="192" width="7" height="160" fill="#17365D"/><text x="88" y="230" class="head">Nguồn và thu thập</text><text x="88" y="267" class="body">ITviec · TopCV · VietnamWorks</text><text x="88" y="296" class="body">TopDev · LinkedIn</text><text x="88" y="325" class="body">Lưu nội dung tin, URL và thông tin nguồn</text><rect x="680" y="192" width="540" height="160" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="680" y="192" width="7" height="160" fill="#17365D"/><text x="703" y="230" class="head">Kết hợp và loại trùng ban đầu</text><text x="703" y="267" class="body">Đưa dữ liệu về cấu trúc chung</text><text x="703" y="296" class="body">Loại trùng URL / trong cùng nguồn</text><text x="703" y="325" class="body">Bổ sung nội dung từ trang chi tiết</text><rect x="1295" y="192" width="540" height="160" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="1295" y="192" width="7" height="160" fill="#17365D"/><text x="1318" y="230" class="head">Lọc và trích xuất bằng AI</text><text x="1318" y="267" class="body">Lọc công việc trong phạm vi phân tích</text><text x="1318" y="296" class="body">Tổ chức mô tả; trích xuất công nghệ</text><text x="1318" y="325" class="body">Phân loại nghề, cấp bậc, địa điểm</text><polyline points="605,272 680,272" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1220,272 1295,272" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="430" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="65" y="430" width="7" height="180" fill="#007F83"/><text x="88" y="468" class="head">Kiểm tra và chuẩn hóa bổ sung</text><text x="88" y="505" class="body">Kiểm tra kiểu dữ liệu, thiếu, bất thường</text><text x="88" y="534" class="body">Chuẩn hóa ngày và tên kỹ năng</text><text x="88" y="563" class="body">Tách lương, tiền tệ, kỳ trả lương</text><text x="88" y="592" class="body">Tìm cặp nghi trùng liên nguồn</text><rect x="680" y="430" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="680" y="430" width="7" height="180" fill="#007F83"/><text x="703" y="468" class="head">Nạp và quản lý phiên bản</text><text x="703" y="505" class="body">Hash đầu vào + phiên bản quy tắc</text><text x="703" y="534" class="body">Giữ dữ liệu đầu vào và nhật ký kiểm tra</text><text x="703" y="563" class="body">Chạy lại không nhân bản cùng dữ liệu</text><text x="703" y="592" class="body">Cặp nghi trùng lưu để kiểm tra</text><rect x="1295" y="430" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="1295" y="430" width="7" height="180" fill="#007F83"/><text x="1318" y="468" class="head">Kiểm soát trước khi công bố</text><text x="1318" y="505" class="body">Kiểm tra khóa và quan hệ</text><text x="1318" y="534" class="body">Đối chiếu số tin, số liên kết kỹ năng</text><text x="1318" y="563" class="body">Cập nhật lõi và mart cùng giao dịch</text><text x="1318" y="592" class="body">Lỗi: giữ phiên bản đang hoạt động</text><polyline points="1565,352 1565,390 335,390 335,430" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="605,520 680,520" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1220,520 1295,520" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="678" class="head" style="fill:#007F83">02  LƯU TRỮ VÀ TỔ CHỨC PHÂN TÍCH</text><rect x="65" y="710" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="65" y="710" width="7" height="180" fill="#17365D"/><text x="88" y="748" class="head">Lõi CSDL quan hệ • 3NF</text><text x="88" y="785" class="body">Tin đăng và nội dung từng phiên bản</text><text x="88" y="814" class="body">Danh mục; lương; quan hệ tin–kỹ năng</text><text x="88" y="843" class="body">Dữ liệu đầu vào, chất lượng và ứng viên trùng</text><text x="88" y="872" class="body">16 bảng trong SQLite</text><rect x="680" y="710" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="680" y="710" width="7" height="180" fill="#17365D"/><text x="703" y="748" class="head">Data mart • Star Schema</text><text x="703" y="785" class="body">fact_job_posting + 9 dimension</text><text x="703" y="814" class="body">bridge_posting_skill cho kỹ năng đa trị</text><text x="703" y="843" class="body">Tạo số đo và cờ phục vụ phân tích</text><text x="703" y="872" class="body">Grain: một tin / một phiên bản</text><rect x="1295" y="710" width="540" height="180" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="1295" y="710" width="7" height="180" fill="#17365D"/><text x="1318" y="748" class="head">Lớp truy vấn phân tích</text><text x="1318" y="785" class="body">v_star_postings: một dòng cho mỗi fact</text><text x="1318" y="814" class="body">Chọn phiên bản đang hoạt động</text><text x="1318" y="843" class="body">Lọc kỹ năng qua bảng cầu riêng</text><text x="1318" y="872" class="body">Tính KPI theo đúng phạm vi và mẫu số</text><polyline points="1565,610 1565,645 335,645 335,710" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="605,800 680,800" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1220,800 1295,800" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="961" class="head" style="fill:#007F83">03  TRỰC QUAN HÓA VÀ CẬP NHẬT</text><rect x="65" y="990" width="540" height="185" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="65" y="990" width="7" height="185" fill="#17365D"/><text x="88" y="1028" class="head">Jupyter Notebook</text><text x="88" y="1065" class="body">Câu hỏi phân tích và chỉ số</text><text x="88" y="1094" class="body">Biểu đồ Plotly, bảng thống kê</text><text x="88" y="1123" class="body">Nhận xét và giới hạn của kết luận</text><text x="88" y="1152" class="body">Chạy lại notebook khi đổi dữ liệu</text><rect x="680" y="990" width="540" height="185" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="680" y="990" width="7" height="185" fill="#17365D"/><text x="703" y="1028" class="head">Dashboard • Streamlit + Plotly</text><text x="703" y="1065" class="body">Bộ lọc và biểu đồ tương tác</text><text x="703" y="1094" class="body">Tổng quan · Nghề · Lương · Chất lượng</text><text x="703" y="1123" class="body">Xuất dữ liệu sau lọc ra CSV</text><text x="703" y="1152" class="body">Đọc lại CSDL mỗi 30 giây khi đang mở</text><rect x="1295" y="990" width="540" height="185" rx="9" fill="#F5F8FC" stroke="#C9D5E3"/><rect x="1295" y="990" width="7" height="185" fill="#A9651F"/><text x="1318" y="1028" class="head">Watcher cập nhật đầu vào</text><text x="1318" y="1065" class="body">Kiểm tra file mỗi 60 giây khi chạy</text><text x="1318" y="1094" class="body">Có thay đổi → kích hoạt lại pipeline</text><text x="1318" y="1123" class="body">Thành công → chuyển phiên bản dữ liệu</text><text x="1318" y="1152" class="body">Dashboard hiển thị phiên bản mới</text><polyline points="1565,890 1565,925 335,925 335,990" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="950,925 950,990" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1835,1082 1865,1082 1865,412 40,412 40,470 65,470" fill="none" stroke="#617A96" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8,6"/><text x="65" y="1235" class="note">Quy ước: mũi tên liền = luồng dữ liệu; nét đứt = kích hoạt cập nhật.</text><text x="65" y="1270" class="note">Đơn vị đếm: tin đăng theo nguồn. Cặp nghi trùng liên nguồn chưa được tự động gộp.</text></svg>